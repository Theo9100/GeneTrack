name: Explorer la base des médicaments vétérinaires
# Tâche ponctuelle de reconnaissance : affiche la structure des données publiques ANMV (pro.anses.fr).
on:
  workflow_dispatch:
  push:
    branches: [claude/vigilant-dirac-5aggsc]
    paths: ['.github/workflows/explorer-medicaments.yml', 'scripts/explorer_medicaments.py']
permissions:
  contents: read
jobs:
  explorer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Base XML V2
        run: |
          curl -sSL https://pro.anses.fr/RCP/amm-vet-fr-v2-v.7z -o v2.7z
          7z x -y -ov2 v2.7z >/dev/null
          find v2 -type f -exec ls -la {} \;
          f=$(find v2 -type f -name '*.xml' | head -1)
          head -c 3000 "$f"; echo
          timeout 600 python3 scripts/explorer_medicaments.py "$f"
